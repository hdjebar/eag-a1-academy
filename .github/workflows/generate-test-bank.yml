name: Generate candidate test bank

on:
  workflow_dispatch:
    inputs:
      category:
        description: Test family
        required: true
        type: choice
        options: [abstract, verbal, numeric, planning, situational]
      count:
        description: Number of candidate items (1-50)
        required: true
        default: "20"

# Generation and review never write to the repository: only the final PR job,
# which consumes the read-only job's artifact, gets write access.
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CATEGORY: ${{ inputs.category }}
      COUNT: ${{ inputs.count }}
      AI_API_URL: ${{ secrets.AI_API_URL }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check configuration
        run: |
          test -n "$AI_API_URL" || (echo "Missing AI_API_URL secret" && exit 1)
          test -n "$AI_API_KEY" || (echo "Missing AI_API_KEY secret" && exit 1)
          test -n "$AI_MODEL" || (echo "Missing AI_MODEL variable" && exit 1)
      - name: Generate candidates
        run: node scripts/generate-bank.mjs
      - name: Blind AI review
        run: node scripts/review-bank.mjs
      - name: Deterministic validation
        run: node scripts/validate-bank.mjs "$(cat generated/latest.txt)"
      - name: Unit checks
        run: npm test
      - name: Upload review package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eag-${{ inputs.category }}-candidate-bank
          path: |
            generated/*.json
            generated/latest.txt
          retention-days: 30

  # Pull requests opened with the default GITHUB_TOKEN do not trigger other workflows,
  # so "Validate question banks" would never run on them. Add a BOT_TOKEN secret
  # (fine-grained PAT: contents + pull requests write) to get CI checks on the PR.
  open-pr:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      CATEGORY: ${{ inputs.category }}
      PUSH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.PUSH_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eag-${{ inputs.category }}-candidate-bank
          path: generated
      - name: Open human-review pull request
        run: |
          # The artifact comes from the job that ran npm ci with the AI secrets: treat it as
          # untrusted. Accept only the exact name generate-bank.mjs writes, and never paste
          # it into code — node receives the path as an argument.
          file="$(head -n 1 generated/latest.txt)"
          if ! printf '%s' "$file" | grep -Eqx "generated/${CATEGORY}-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{3}Z-[0-9a-f]{6}\.json"; then
            echo "::error::Nom de fichier candidat inattendu dans latest.txt"; exit 1
          fi
          review="${file%.json}.review.json"
          test -f "$file" && test -f "$review" || { echo "::error::Fichier candidat ou revue absent de l'artefact"; exit 1; }
          branch="ai-bank/${CATEGORY}-${GITHUB_RUN_ID}"
          summary="$(node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const t={};for(const x of r.reviews){const k=String(x.decision).replace(/[^a-z_-]/g,"");t[k]=(t[k]||0)+1}console.log(Object.entries(t).map(([k,v])=>k+": "+v).join(", "))' "$review")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -f "$file" "$review"
          git commit -m "chore: add AI-assisted ${CATEGORY} candidates"
          git push origin "$branch"
          body=$(cat <<BODY
          Candidate questions generated by AI and checked by a **blind** AI review (${summary}).

          **This PR cannot be merged as is**: CI fails while files remain in \`generated/\`. To approve items, check out this branch and run:

          \`\`\`bash
          npm ci
          node scripts/promote-candidate.mjs ${file} --reviewer "Your Name" --approve <id1,id2,...>
          git rm -q --ignore-unmatch ${file} ${review}
          git commit -am "feat: approve ${CATEGORY} items" && git push
          \`\`\`

          Only items whose blind review is \`pass\` are promoted unless you add \`--ignore-ai-review\`. Check correctness, uniqueness, wording, fairness and CONTRIBUTING.md for every item you approve.
          BODY
          )
          gh pr create --base main --head "$branch" --title "Review AI-assisted ${CATEGORY} question bank" --body "$body"
