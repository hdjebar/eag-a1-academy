name: Validate question banks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate candidate files when present
        run: |
          files=""
          if [ -d generated ]; then
            files=$(find generated -maxdepth 1 -name '*.json' ! -name '*.review.json' -print)
          fi
          if [ -n "$files" ]; then node scripts/validate-bank.mjs $files; fi
      - name: Block merging unpromoted candidates
        if: github.event_name == 'pull_request'
        run: |
          left=$(git ls-files 'generated/*.json')
          if [ -n "$left" ]; then
            echo "::error::Candidate files must be promoted (scripts/promote-candidate.mjs) or deleted before merge:"
            echo "$left"
            exit 1
          fi

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
