name: Validate question banks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate candidate files when present
        run: |
          files=""
          if [ -d generated ]; then
            files=$(find generated -maxdepth 1 -name '*.json' ! -name '*.review.json' -print)
          fi
          if [ -n "$files" ]; then node scripts/validate-bank.mjs $files; fi
      - name: Block merging unpromoted candidates
        if: github.event_name == 'pull_request'
        run: |
          left=$(git ls-files 'generated/*.json')
          if [ -n "$left" ]; then
            echo "::error::Candidate files must be promoted (scripts/promote-candidate.mjs) or deleted before merge:"
            echo "$left"
            exit 1
          fi
